name: Tests and installable package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    # Python 3.8 is unavailable on newer Ubuntu runner images.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: thunder-python-${{ matrix.python }}
          path: dist/*.zip
  official-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install kodi-addon-checker==0.0.36
      - run: python tools/build.py --stage build/official
      - run: python tools/check_official.py build/official/service.subtitles.thunder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kodi-official-check
          path: kodi-addon-checker-report.log
